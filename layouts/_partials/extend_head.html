{{- /* Mermaid csak ott töltődik be, ahol a render hook mermaid blokkot talált.
       A .Content hívás rendereli a tartalmat (és így a hookot) még a head előtt;
       a footer azért nem jó hely, mert a PaperMod partialCached-del hívja. */ -}}
{{- $_ := .Content -}}
{{- if .Store.Get "hasMermaid" }}
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  const blocks = [...document.querySelectorAll("pre.mermaid")];
  blocks.forEach((el) => (el.dataset.src = el.textContent));
  const render = async () => {
    const dark = document.documentElement.dataset.theme === "dark";
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
    blocks.forEach((el) => {
      el.removeAttribute("data-processed");
      el.textContent = el.dataset.src;
    });
    await mermaid.run({ nodes: blocks });
  };
  render();
  document.getElementById("theme-toggle")?.addEventListener("click", () => setTimeout(render, 0));
</script>
{{- end }}
